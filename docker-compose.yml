services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: drishti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drishti_secure_password_2024}
      POSTGRES_DB: ${POSTGRES_DB:-drishti_db}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - drishti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drishti} -d ${POSTGRES_DB:-drishti_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional - for caching and real-time features)
  redis:
    image: redis:7-alpine
    container_name: drishti-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - drishti-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MediaMTX - the live stream layer.
  # Loops the clips in media/clips/ as one RTSP endpoint per camera, and republishes
  # them as HLS and WebRTC so a browser can play them. The paths are generated by
  # scripts/generate-streams.js; docker/mediamtx.yml is that generator's output.
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:-latest}-ffmpeg
    container_name: drishti-mediamtx
    restart: unless-stopped
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"       # RTSP, what the health poller probes
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"        # HLS, what the browser plays
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"     # WebRTC signalling
      - "${MEDIAMTX_WEBRTC_UDP_PORT:-8189}:8189/udp"
      - "${MEDIAMTX_API_PORT:-9997}:9997"        # control API
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
      - ./media/clips:/media:ro
    networks:
      - drishti-network
    healthcheck:
      # The control API answering means the server is up. Whether any individual path
      # is publishing is a separate question, and the camera health poller is what
      # answers it - per camera, not for the server as a whole.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9997/v3/config/global/get > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The analytics engine. Every detection in the product is produced here.
  ai-service:
    build: ./ai-service
    container_name: drishti-ai
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8100}:8100"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      FRAME_STRIDE: ${FRAME_STRIDE:-3}
      SNAPSHOT_DIR: /snapshots
      # Unset by default. Plate reading stays off until a real detector is
      # supplied - it never guesses where a plate is.
      PLATE_MODEL_PATH: ${PLATE_MODEL_PATH:-}
    volumes:
      # Weights are downloaded on first use and kept, never baked into the image
      # and never committed.
      - ai_models:/models
      - ai_snapshots:/snapshots
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - drishti-network

volumes:
  postgres_data:
    driver: local
  ai_models:
    driver: local
  ai_snapshots:
    driver: local
  redis_data:
    driver: local

networks:
  drishti-network:
    driver: bridge
